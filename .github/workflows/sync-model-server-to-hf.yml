name: Deploy Balochi model server to Hugging Face

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "services/balochi-model-server/**"
      - ".github/workflows/sync-model-server-to-hf.yml"

jobs:
  deploy:
    if: ${{ vars.HF_SPACE_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub client
        run: pip install --upgrade huggingface_hub

      - name: Create or update Docker Space
        env:
          HF_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi

          token = os.environ["HF_TOKEN"]
          repo_id = os.environ["HF_SPACE_ID"]
          api = HfApi(token=token)

          api.create_repo(
              repo_id=repo_id,
              repo_type="space",
              space_sdk="docker",
              exist_ok=True,
              private=False,
          )

          api.upload_folder(
              folder_path="services/balochi-model-server",
              repo_id=repo_id,
              repo_type="space",
              commit_message="Deploy Zubán Balochi model server from GitHub",
          )

          print(f"Deployed to https://huggingface.co/spaces/{repo_id}")
          PY
