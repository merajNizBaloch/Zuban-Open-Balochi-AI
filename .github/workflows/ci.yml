name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate Balochi model server Python
        run: python -m py_compile services/balochi-model-server/app.py

      - name: Live Zuban chat smoke test
        shell: bash
        run: |
          set -u
          CANDIDATES=(
            "https://zuban.techcraftsolution.com"
            "https://zuban-open-balochi-ai.vercel.app"
            "https://zuban-open-balochi-ai-tech-craft2.vercel.app"
          )

          for BASE in "${CANDIDATES[@]}"; do
            echo "=== TRYING $BASE ==="
            CHAT_CODE=$(curl -L -sS -o /tmp/chat.txt -w "%{http_code}" --max-time 45 \
              -X POST "$BASE/api/chat/stream" \
              -H "Content-Type: application/json" \
              --data '{"input":"Hello Zuban. Reply in one short sentence.","messages":[{"role":"user","content":"Hello Zuban. Reply in one short sentence."}],"dialect":"auto","scriptPreference":"auto"}' || true)

            echo "CHAT_CODE=$CHAT_CODE"
            echo "CHAT_BODY:"
            head -c 2500 /tmp/chat.txt 2>/dev/null || true
            echo
            echo

            if [ "$CHAT_CODE" = "200" ] && [ -s /tmp/chat.txt ]; then
              echo "SMOKE_TEST_SUCCESS=$BASE"
              exit 0
            fi
          done

          echo "SMOKE_TEST_FAILED"
          exit 1
