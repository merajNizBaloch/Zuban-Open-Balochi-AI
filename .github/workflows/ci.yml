name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate Balochi model server Python
        run: python -m py_compile services/balochi-model-server/app.py

      - name: Live Zuban production chat test
        shell: bash
        run: |
          MARKER_CODE=$(curl -L -sS -o /tmp/zuban-marker.txt -w "%{http_code}" --max-time 20 \
            "https://zuban.techcraftsolution.com/zuban-deploy-marker.txt" || true)
          echo "MARKER_CODE=$MARKER_CODE"
          echo "MARKER_BODY:"
          cat /tmp/zuban-marker.txt 2>/dev/null || true
          echo

          CHAT_CODE=$(curl -L -sS -o /tmp/zuban-chat.txt -w "%{http_code}" --max-time 45 \
            -X POST "https://zuban.techcraftsolution.com/api/chat/stream" \
            -H "Content-Type: application/json" \
            --data '{"input":"Hello Zuban. Reply in one short sentence.","messages":[{"role":"user","content":"Hello Zuban. Reply in one short sentence."}],"dialect":"auto","scriptPreference":"auto"}' || true)
          echo "CHAT_CODE=$CHAT_CODE"
          echo "CHAT_BODY:"
          cat /tmp/zuban-chat.txt 2>/dev/null || true
          echo

          test "$MARKER_CODE" = "200"
          grep -q "ZUBAN_DEPLOY_MARKER_2026_09_12_1224" /tmp/zuban-marker.txt
          test "$CHAT_CODE" = "200"
          test -s /tmp/zuban-chat.txt
