name: CI

on:
  push:
    branches: ["main", "infra-diagnose"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate Balochi model server Python
        run: python -m py_compile services/balochi-model-server/app.py

      - name: Check Vercel CI access
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          [ -n "$VERCEL_TOKEN" ] && echo "VERCEL_TOKEN_PRESENT=yes" || echo "VERCEL_TOKEN_PRESENT=no"
          [ -n "$VERCEL_ORG_ID" ] && echo "VERCEL_ORG_ID_PRESENT=yes" || echo "VERCEL_ORG_ID_PRESENT=no"
          [ -n "$VERCEL_PROJECT_ID" ] && echo "VERCEL_PROJECT_ID_PRESENT=yes" || echo "VERCEL_PROJECT_ID_PRESENT=no"

      - name: Diagnose production routing
        shell: bash
        run: |
          set +e
          for URL in \
            "https://zuban.techcraftsolution.com/" \
            "https://zuban.techcraftsolution.com/docs" \
            "https://zuban-open-balochi-ai.vercel.app/" \
            "https://zuban-open-balochi-ai-tech-craft2.vercel.app/"
          do
            echo "===== $URL ====="
            curl -sS -L -D /tmp/headers.txt -o /tmp/body.txt --max-time 30 "$URL"
            CODE=$?
            echo "curl_exit=$CODE"
            echo "--- headers ---"
            cat /tmp/headers.txt
            echo "--- body first 500 ---"
            head -c 500 /tmp/body.txt
            echo
            echo
          done


      - name: Smoke test production chat
        shell: bash
        run: |
          set -euo pipefail
          BODY_FILE=/tmp/chat-body.txt
          CODE=$(curl -sS -o "$BODY_FILE" -w "%{http_code}" --max-time 45 \
            -X POST "https://zuban.techcraftsolution.com/api/chat/stream" \
            -H "Content-Type: application/json" \
            --data '{"input":"Salam. Reply briefly in Balochi."}')
          echo "CHAT_HTTP=$CODE"
          echo "CHAT_BODY_START"
          cat "$BODY_FILE"
          echo
          echo "CHAT_BODY_END"
          test "$CODE" = "200"
          test -s "$BODY_FILE"
