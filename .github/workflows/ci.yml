name: CI

on:
  push:
    branches: ["main", "infra-diagnose"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate Balochi model server Python
        run: python -m py_compile services/balochi-model-server/app.py

      - name: Check Vercel CI access
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          [ -n "$VERCEL_TOKEN" ] && echo "VERCEL_TOKEN_PRESENT=yes" || echo "VERCEL_TOKEN_PRESENT=no"
          [ -n "$VERCEL_ORG_ID" ] && echo "VERCEL_ORG_ID_PRESENT=yes" || echo "VERCEL_ORG_ID_PRESENT=no"
          [ -n "$VERCEL_PROJECT_ID" ] && echo "VERCEL_PROJECT_ID_PRESENT=yes" || echo "VERCEL_PROJECT_ID_PRESENT=no"

      - name: Diagnose production routing
        shell: bash
        run: |
          set +e
          for URL in \
            "https://zuban.techcraftsolution.com/" \
            "https://zuban.techcraftsolution.com/docs" \
            "https://zuban-open-balochi-ai.vercel.app/" \
            "https://zuban-open-balochi-ai-tech-craft2.vercel.app/"
          do
            echo "===== $URL ====="
            curl -sS -L -D /tmp/headers.txt -o /tmp/body.txt --max-time 30 "$URL"
            CODE=$?
            echo "curl_exit=$CODE"
            echo "--- headers ---"
            cat /tmp/headers.txt
            echo "--- body first 500 ---"
            head -c 500 /tmp/body.txt
            echo
            echo
          done


      - name: Smoke test production free services
        shell: bash
        run: |
          set -euo pipefail

          post_json() {
            NAME="$1"
            URL="$2"
            DATA="$3"
            BODY="/tmp/$NAME.txt"
            CODE=$(curl -sS -o "$BODY" -w "%{http_code}" --max-time 45 \
              -X POST "$URL" \
              -H "Content-Type: application/json" \
              --data "$DATA")
            echo "$NAME HTTP=$CODE"
            cat "$BODY"
            echo
            test "$CODE" = "200"
            test -s "$BODY"
          }

          post_json chat_lookup \
            "https://zuban.techcraftsolution.com/api/chat/stream" \
            '{"input":"What does دوست mean?"}'

          post_json chat_general \
            "https://zuban.techcraftsolution.com/api/chat/stream" \
            '{"input":"Tell me about Balochi"}'

          post_json translate_word \
            "https://zuban.techcraftsolution.com/api/text" \
            '{"mode":"translate","input":"water","source":"English","target":"Balochi"}'

          post_json translate_sentence \
            "https://zuban.techcraftsolution.com/api/text" \
            '{"mode":"translate","input":"water and fire","source":"English","target":"Balochi"}'
          grep -q 'آپ and آس' /tmp/translate_sentence.txt

          HEALTH=$(curl -sS --max-time 30 "https://zuban.techcraftsolution.com/api/health")
          echo "health=$HEALTH"
          echo "$HEALTH" | grep -q '"freeLexiconFallback":true'
          echo "$HEALTH" | grep -q '"browserFallback":false'
