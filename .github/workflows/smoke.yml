name: HF corpus search probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe parallel corpus search
        shell: bash
        run: |
          set -euo pipefail
          for Q in \
            "How are you?" \
            "I am going home." \
            "I want to drink water." \
            "Where are you going?" \
            "Thank you very much."
          do
            echo "=== $Q ==="
            curl -sS --max-time 20 --get \
              "https://datasets-server.huggingface.co/search" \
              --data-urlencode "dataset=Aynkader/Balochi-dataset" \
              --data-urlencode "config=default" \
              --data-urlencode "split=train" \
              --data-urlencode "query=$Q" \
              --data-urlencode "offset=0" \
              --data-urlencode "length=10" \
              -w "\nHTTP=%{http_code}\n"
          done
