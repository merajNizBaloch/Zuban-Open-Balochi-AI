name: HF translator probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public Balochi translator
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://bakhteyar-latani-balochi.hf.space"
          echo "OPENAPI"
          curl -sS --max-time 30 "$BASE/gradio_api/openapi.json" | head -c 12000
          echo
          echo "CONFIG"
          curl -sS --max-time 30 "$BASE/config" | head -c 12000
          echo
