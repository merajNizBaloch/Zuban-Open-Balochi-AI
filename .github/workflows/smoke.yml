name: Balochi Space probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Balochi translator Spaces
        shell: bash
        run: |
          set -euo pipefail
          for BASE in \
            "https://bakhteyar-english-balochi-translator.hf.space" \
            "https://bakhteyar-neurolingo-2.hf.space" \
            "https://bakhteyar-latani-balochi.hf.space"
          do
            echo "=== $BASE /config ==="
            curl -sS --max-time 60 "$BASE/config" -w "\nHTTP=%{http_code}\n" | head -c 18000 || true
            echo
          done
