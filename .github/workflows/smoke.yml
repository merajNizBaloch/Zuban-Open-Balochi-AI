name: Arabic Balochi corpus probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect Arabic-script corpus
        shell: bash
        run: |
          set -euo pipefail
          URL="https://huggingface.co/datasets/shayak111/Balochi-Multilingual-dataset/resolve/main/Extras/Balochi_english-translation_corpus.json"
          curl -L -sS --max-time 30 "$URL" -o /tmp/corpus.json
          wc -c /tmp/corpus.json
          python3 - <<'PY'
          import json
          p="/tmp/corpus.json"
          data=json.load(open(p,encoding="utf-8"))
          print(type(data).__name__, len(data) if hasattr(data,"__len__") else "")
          if isinstance(data, list):
              for row in data[:8]:
                  print(repr(row))
          elif isinstance(data, dict):
              print(list(data.keys())[:20])
              for k,v in list(data.items())[:3]:
                  print(k, repr(v)[:1000])
          PY
