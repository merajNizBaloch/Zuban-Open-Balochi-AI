name: Free Balochi provider probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe no-key translation providers
        shell: bash
        run: |
          set -euo pipefail
          Q="Hello, how are you? I am going home to drink water."

          echo "=== LINGVA OFFICIAL ==="
          curl -sS --max-time 25 \
            --get "https://lingva.ml/api/v1/en/bal/$Q" \
            -w "\nHTTP=%{http_code}\n" || true

          echo "=== LINGVA JAE ==="
          curl -sS --max-time 25 \
            --get "https://translate.jae.fi/api/v1/en/bal/$Q" \
            -w "\nHTTP=%{http_code}\n" || true

          echo "=== LINGVA DR460 ==="
          curl -sS --max-time 25 \
            --get "https://translate.dr460nf1r3.org/api/v1/en/bal/$Q" \
            -w "\nHTTP=%{http_code}\n" || true

          echo "=== MYMEMORY BAL ==="
          curl -sS --max-time 25 \
            --get "https://api.mymemory.translated.net/get" \
            --data-urlencode "q=$Q" \
            --data-urlencode "langpair=en|bal" \
            -w "\nHTTP=%{http_code}\n" || true
