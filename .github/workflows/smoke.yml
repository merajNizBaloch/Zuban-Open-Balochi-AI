name: Google Balochi probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Google Balochi translation endpoint
        shell: bash
        run: |
          set -euo pipefail
          for CODE in bal bal-Arab bal-Latn; do
            echo "=== $CODE ==="
            curl -sS --max-time 20 --get \
              "https://translate.googleapis.com/translate_a/single" \
              --data-urlencode "client=gtx" \
              --data-urlencode "sl=en" \
              --data-urlencode "tl=$CODE" \
              --data-urlencode "dt=t" \
              --data-urlencode "q=Hello, how are you? I am going home to drink water." \
              -w "\nHTTP=%{http_code}\n" || true
          done
