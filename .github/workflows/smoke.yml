name: Lingva Balochi probe

on:
  pull_request:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Probe Lingva Balochi translation
        shell: bash
        run: |
          set -euo pipefail
          Q='Hello, how are you? I am going home to drink water.'

          for BASE in \
            "https://lingva.ml" \
            "https://translate.jae.fi" \
            "https://translate.dr460nf1r3.org"
          do
            echo "=== $BASE languages ==="
            curl -sS --max-time 20 "$BASE/api/v1/languages/target" | grep -oiE '.{0,80}(balochi|baluchi|"bal").{0,80}' || true
            echo
            echo "=== $BASE translate ==="
            curl -sS --max-time 25 \
              -X POST "$BASE/api/v1/en/bal" \
              -H "Content-Type: application/json" \
              --data "$(python3 -c 'import json; print(json.dumps({"query": """'"$Q"'"""}))')" \
              -w "\nHTTP=%{http_code}\n" || true
            echo
          done
