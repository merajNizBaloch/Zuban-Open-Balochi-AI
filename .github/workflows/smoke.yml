name: Sentence translation smoke

on:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify basic sentence translation live
        shell: bash
        run: |
          set -euo pipefail

          check() {
            NAME="$1"
            DATA="$2"
            EXPECT="$3"
            BODY="/tmp/$NAME.json"
            CODE=$(curl -sS -o "$BODY" -w "%{http_code}" --max-time 30 \
              -X POST "https://zuban.techcraftsolution.com/api/text" \
              -H "Content-Type: application/json" \
              --data "$DATA")
            echo "$NAME HTTP=$CODE"
            cat "$BODY"
            echo
            test "$CODE" = "200"
            grep -Fq "$EXPECT" "$BODY"
          }

          check how_are_you '{"mode":"translate","input":"How are you?","source":"English","target":"Balochi"}' 'تو چون ئے'
          check i_am_fine '{"mode":"translate","input":"I am fine","source":"English","target":"Balochi"}' 'من وشاں'
          check your_name '{"mode":"translate","input":"What is your name?","source":"English","target":"Balochi"}' 'تئی نام کئے اِنت'
          check good_morning '{"mode":"translate","input":"Good morning","source":"English","target":"Balochi"}' 'سُہب وش بات'
          check thanks '{"mode":"translate","input":"Thank you very much","source":"English","target":"Balochi"}' 'تئی باز باز منّت وار'
          check reverse '{"mode":"translate","input":"تو چون ئے","source":"Balochi","target":"English"}' 'how are you'
