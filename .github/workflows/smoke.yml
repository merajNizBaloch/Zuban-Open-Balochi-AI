name: Arabic corpus analysis

on:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Analyze corpus sentence coverage
        shell: bash
        run: |
          set -euo pipefail
          URL="https://huggingface.co/datasets/shayak111/Balochi-Multilingual-dataset/resolve/main/Extras/Balochi_english-translation_corpus.json"
          curl -L -sS --max-time 30 "$URL" -o /tmp/corpus.json
          python3 - <<'PY'
          import json,re
          data=json.load(open("/tmp/corpus.json",encoding="utf-8"))
          rows=[]
          for group in data["translation_samples"]:
              for row in group.get("translations",[]):
                  if row.get("english") and row.get("balochi"):
                      rows.append(row)
          print("rows",len(rows))
          buckets={"1":0,"2-3":0,"4-7":0,"8+":0}
          for r in rows:
              n=len(r["english"].split())
              if n==1:buckets["1"]+=1
              elif n<=3:buckets["2-3"]+=1
              elif n<=7:buckets["4-7"]+=1
              else:buckets["8+"]+=1
          print("buckets",buckets)
          for q in ["how are you","i am fine","where are you going","i want water","thank you","what is your name","i am going home","good morning"]:
              hits=[r for r in rows if q in r["english"].lower()]
              print("\nQUERY",q,"hits",len(hits))
              for r in hits[:8]: print(r["english"],"=>",r["balochi"])
          print("\nLONG SAMPLES")
          for r in [r for r in rows if len(r["english"].split())>=5][:25]:
              print(r["english"],"=>",r["balochi"])
          PY
